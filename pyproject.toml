[project]
name = "resistor-pose-inference"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hartley Blakey", email = "hartleyblakey@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "albumentations>=2.0.8",
    "breadboard-classifier",
    "rfdetr>=1.11.2",
    "ultralytics>=8.4.202",
]

[project.scripts]
resistor-pose-inference = "resistor_pose_inference:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
breadboard-classifier = { git = "https://github.com/stonestephenson/Breadboard-Classifier" }
